ekf_filter_node:
  ros__parameters:
    frequency: 200.0
    sensor_timeout: 0.05
    two_d_mode: false

    publish_tf: true
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # --- IMU ---
    imu0: /imu
    imu0_queue_size: 50
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

    # --- TWIST (body-frame velocity measurement) ---
    twist0: /twist
    twist0_queue_size: 50
    twist0_config: [false, false, false,
                    false, false, false,
                    true,  true,  true,
                    false, false, true,
                    false, false, false]
    twist0_differential: false
    twist0_relative: false

    # Optional: helps startup stability
    reset_on_time_jump: true
